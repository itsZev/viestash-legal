<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>OAuth Callback — VIESTASH</title>
<style>
  :root { color-scheme: light; }
  body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; line-height: 1.6; color: #1f2329; background: #fff; }
  main { max-width: 760px; margin: 0 auto; padding: 48px 24px; }
  h1 { font-size: 1.6rem; margin: 0 0 8px; }
  p { color: #646a73; margin: 0 0 18px; }
  pre { background: #f5f6f7; border: 1px solid #e5e6eb; border-radius: 8px; padding: 16px; overflow-wrap: anywhere; white-space: pre-wrap; font-size: 0.95rem; }
  button { margin-top: 12px; padding: 8px 16px; border: 0; border-radius: 6px; background: #1f6feb; color: #fff; font-size: 0.95rem; cursor: pointer; }
</style>
</head>
<body>
<main>
  <h1>OAuth Callback</h1>
  <p>Copy the authorization code below and return to the application. This page does not store or transmit the code.</p>
  <pre id="code">(no code found)</pre>
  <button id="copy" type="button">Copy code</button>
</main>
<script>
  const params = new URLSearchParams(location.search);
  const code = params.get('code') || '';
  document.getElementById('code').textContent = code || '(no code found)';
  document.getElementById('copy').addEventListener('click', async () => {
    if (!code) return;
    try { await navigator.clipboard.writeText(code); } catch (_) {}
  });
</script>
</body>
</html>
